services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pixaeron_auth
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pixaeron_auth']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  conversion-postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: conversion
      POSTGRES_PASSWORD: conversion
      POSTGRES_DB: pixaeron_conversion
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - conversion_postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U conversion -d pixaeron_conversion']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conversion_data

  notifications-postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
      POSTGRES_DB: pixaeron_notifications
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - notifications_postgres18_data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U notifications -d pixaeron_notifications']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notifications_data

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/auth/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      REDIS_URL: redis://redis:6379
      NOTIFICATIONS_GRPC_URL: notifications-command:50052
      NOTIFICATIONS_GRPC_DEADLINE_MS: 2000
      EMAIL_ACTION_RESPONSE_BUDGET_MS: 2500
      ENTITLEMENTS_GRPC_HOST: 0.0.0.0
      ENTITLEMENTS_GRPC_PORT: 50053
    command: >-
      sh -c "./node_modules/.bin/prisma migrate deploy
      --config apps/auth/prisma.config.ts && node main.js"
    ports:
      - '127.0.0.1:3001:3000'
      - '127.0.0.1:50053:50053'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/auth/health').then((response) => {
            if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - default
      - notifications_command

  notifications:
    build:
      context: .
      dockerfile: apps/notifications/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/notifications/.env
    environment:
      NODE_ENV: development
      PORT: 3004
      DATABASE_URL: postgresql://notifications:notifications@notifications-postgres:5432/pixaeron_notifications?schema=public
      NOTIFICATIONS_GRPC_HOST: notifications-command
      NOTIFICATIONS_GRPC_PORT: 50052
    command: >-
      sh -c "./node_modules/.bin/prisma migrate deploy
      --config apps/notifications/prisma.config.ts && node main.js"
    depends_on:
      notifications-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3004/notifications/health/ready').then((response) => {
            if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      notifications_command:
        aliases:
          - notifications-command
      notifications_data:
      notifications_egress:

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    env_file:
      - path: apps/gateway/.env
        required: false
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8088;
          printf 'GET /health?ready HTTP/1.0\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - default

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

networks:
  conversion_data:
  notifications_command:
    internal: true
  notifications_data:
  notifications_egress:

volumes:
  conversion_postgres18_data:
  notifications_postgres18_data:
  postgres18_data:
  redis_data:
