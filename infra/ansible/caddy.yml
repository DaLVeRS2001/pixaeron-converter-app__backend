---
- name: Configure Caddy behind Cloudflare Tunnel
  hosts: application_vps
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validate the API domain
      ansible.builtin.assert:
        that:
          - (api_domain | default('')) is match('^[A-Za-z0-9.-]+$')
        fail_msg: Set a valid api_domain in inventory.yml.

    - name: Inspect the Cloudflare Tunnel service
      ansible.builtin.stat:
        path: /etc/systemd/system/cloudflared.service
      register: cloudflared_service

    - name: Read the Cloudflare Tunnel token from the controller
      ansible.builtin.set_fact:
        cloudflare_tunnel_token: >-
          {{ lookup('ansible.builtin.env', 'CLOUDFLARE_TUNNEL_TOKEN') }}
      no_log: true

    - name: Require a token for the first Tunnel installation
      ansible.builtin.assert:
        that:
          - (cloudflare_tunnel_token | length) > 0
        fail_msg: >-
          Export CLOUDFLARE_TUNNEL_TOKEN before the first caddy.yml run.
      when: not cloudflared_service.stat.exists
      no_log: true

  tasks:
    - name: Install repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configure the official Caddy apt repository
      ansible.builtin.deb822_repository:
        name: caddy-stable
        types:
          - deb
        uris:
          - https://dl.cloudsmith.io/public/caddy/stable/deb/debian
        suites:
          - any-version
        components:
          - main
        signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        state: present
      register: caddy_repository

    - name: Configure the official cloudflared apt repository
      ansible.builtin.deb822_repository:
        name: cloudflared
        types:
          - deb
        uris:
          - https://pkg.cloudflare.com/cloudflared
        suites:
          - '{{ ansible_facts.distribution_release }}'
        components:
          - main
        signed_by: https://pkg.cloudflare.com/cloudflare-main.gpg
        state: present
      register: cloudflared_repository

    - name: Install Caddy and cloudflared
      ansible.builtin.apt:
        name:
          - caddy
          - cloudflared
        state: present
        update_cache: '{{ caddy_repository.changed or cloudflared_repository.changed }}'

    - name: Verify the Gateway is ready before cutover
      ansible.builtin.uri:
        url: http://127.0.0.1:8088/health?ready
        status_code: 200
        return_content: false
      changed_when: false
      check_mode: false

    - name: Verify the private Auth JWKS before cutover
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/auth/.well-known/jwks.json
        status_code: 200
        return_content: true
      register: auth_jwks_check
      changed_when: false
      check_mode: false

    - name: Require at least one Auth public key before cutover
      ansible.builtin.assert:
        that:
          - >-
            auth_jwks_check.json is mapping and
            (auth_jwks_check.json.get('keys', []) | length) > 0
        fail_msg: Auth JWKS must contain at least one public key before Caddy cutover.

    - name: Cut over Caddy to Gateway
      block:
        - name: Install the Caddy configuration
          ansible.builtin.template:
            src: templates/Caddyfile.j2
            dest: /etc/caddy/Caddyfile
            owner: root
            group: caddy
            mode: '0644'
            backup: true
            validate: /usr/bin/caddy validate --config %s --adapter caddyfile
          register: caddy_configuration

        - name: Enable and reload Caddy
          ansible.builtin.systemd_service:
            name: caddy
            enabled: true
            state: reloaded

        - name: Verify the Gateway to Auth path through Caddy
          ansible.builtin.uri:
            url: http://127.0.0.1:8080/graphql
            method: POST
            headers:
              Host: '{{ api_domain }}'
            body_format: json
            body:
              query: 'mutation GatewayAuthPath { refreshSession }'
            status_code: 200
            return_content: true
          register: gateway_auth_path_check
          changed_when: false

        - name: Require the expected unauthenticated Auth response
          ansible.builtin.assert:
            that:
              - >-
                gateway_auth_path_check.json is mapping and
                'UNAUTHENTICATED' in (
                  gateway_auth_path_check.json.get('errors', [])
                  | map(attribute='extensions.code', default='')
                  | list
                )
            fail_msg: >-
              Caddy did not route the refresh mutation through Gateway to Auth.
      rescue:
        - name: Restore the previous Caddy configuration
          ansible.builtin.copy:
            remote_src: true
            src: '{{ caddy_configuration.backup_file }}'
            dest: /etc/caddy/Caddyfile
            owner: root
            group: caddy
            mode: '0644'
          when:
            - caddy_configuration is defined
            - (caddy_configuration.backup_file | default('') | length) > 0

        - name: Restart Caddy with the previous configuration
          ansible.builtin.systemd_service:
            name: caddy
            enabled: true
            state: restarted
          when:
            - caddy_configuration is defined
            - (caddy_configuration.backup_file | default('') | length) > 0

        - name: Stop after the rolled-back Caddy cutover
          ansible.builtin.fail:
            msg: >-
              Gateway cutover failed during "{{ ansible_failed_task.name }}".
              The previous Caddy configuration was restored and Caddy was
              restarted.
          when:
            - caddy_configuration is defined
            - (caddy_configuration.backup_file | default('') | length) > 0

        - name: Stop after the Caddy cutover failed without a backup
          ansible.builtin.fail:
            msg: >-
              Gateway cutover failed during "{{ ansible_failed_task.name }}".
              No Caddy backup was created, so no rollback was applied.

    - name: Install the Cloudflare Tunnel service
      ansible.builtin.command:
        argv:
          - cloudflared
          - service
          - install
          - '{{ cloudflare_tunnel_token }}'
      when: not cloudflared_service.stat.exists
      no_log: true

    - name: Enable the Cloudflare Tunnel service
      ansible.builtin.systemd_service:
        name: cloudflared
        enabled: true
        state: started
        daemon_reload: true
