name: pixaeron

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    networks:
      - default

  notifications:
    image: ghcr.io/dalvers2001/pixaeron-notifications:${NOTIFICATIONS_IMAGE_TAG:-sha-not-configured}
    restart: unless-stopped
    env_file:
      - path: ${NOTIFICATIONS_RUNTIME_ENV_FILE:-/opt/pixaeron/notifications.env}
        format: raw
    environment:
      NODE_ENV: production
      PORT: 3004
      NOTIFICATIONS_GRPC_HOST: notifications-command
      NOTIFICATIONS_GRPC_PORT: 50052
    volumes:
      - ${PIXAERON_CERTS_DIR:-/opt/pixaeron/certs}/global-bundle.pem:/app/certs/global-bundle.pem:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3004/notifications/health/ready').then((response) => {
            if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    networks:
      notifications_command:
        aliases:
          - notifications-command
      notifications_egress:

  auth:
    image: ghcr.io/dalvers2001/pixaeron-auth:${AUTH_IMAGE_TAG:-sha-not-configured}
    restart: unless-stopped
    env_file:
      - path: ${AUTH_RUNTIME_ENV_FILE:-/opt/pixaeron/auth.env}
        format: raw
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      NOTIFICATIONS_GRPC_URL: notifications-command:50052
      NOTIFICATIONS_GRPC_DEADLINE_MS: 2000
      EMAIL_ACTION_RESPONSE_BUDGET_MS: 2500
      ENTITLEMENTS_GRPC_HOST: auth-entitlements
      ENTITLEMENTS_GRPC_PORT: 50053
    # Host-private operations and rollback endpoint; never routed publicly by Caddy.
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ${PIXAERON_CERTS_DIR:-/opt/pixaeron/certs}/global-bundle.pem:/app/certs/global-bundle.pem:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/auth/health').then((response) => {
            if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    networks:
      default:
      notifications_command:
      entitlements_command:
        aliases:
          - auth-entitlements

  conversion-api:
    image: ghcr.io/dalvers2001/pixaeron-conversion-api:${CONVERSION_API_IMAGE_TAG:-sha-not-configured}
    restart: unless-stopped
    env_file:
      - path: ${CONVERSION_API_RUNTIME_ENV_FILE:-/opt/pixaeron/conversion-api.env}
        format: raw
        required: false
    environment:
      NODE_ENV: production
      PORT: 3005
      REDIS_URL: redis://redis:6379
      ENTITLEMENTS_GRPC_URL: auth-entitlements:50053
      ENTITLEMENTS_GRPC_DEADLINE_MS: 2000
    volumes:
      - ${PIXAERON_CERTS_DIR:-/opt/pixaeron/certs}/global-bundle.pem:/app/certs/global-bundle.pem:ro
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3005/conversion/health/ready').then((response) => {
            if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1));
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    networks:
      default:
      entitlements_command:

  gateway:
    image: ghcr.io/dalvers2001/pixaeron-gateway:${GATEWAY_IMAGE_TAG:-sha-not-configured}
    restart: unless-stopped
    env_file:
      - path: ${GATEWAY_RUNTIME_ENV_FILE:-/opt/pixaeron/gateway.env}
        format: raw
    ports:
      - '127.0.0.1:4000:4000'
      - '127.0.0.1:8088:8088'
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8088;
          printf 'GET /health?ready HTTP/1.0\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    networks:
      - default

networks:
  notifications_command:
    internal: true
  notifications_egress:
  entitlements_command:
    internal: true

volumes:
  redis_data:
